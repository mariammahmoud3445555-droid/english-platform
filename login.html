<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="miada.css">
</head>

<body>

    <h1>Welcome Back 👋</h1>

    <div class="card">

        <h2>Student Login</h2>

        <form onsubmit="login(event)">

            <p>
                <b>Email</b>
            </p>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <p>
                <b>Password</b>
            </p>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <br>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p>
            Don't have an account?
        </p>

        <button onclick="window.location.href='create-account.html'">
            Create Account
        </button>

        <br>

        <button onclick="window.location.href='index.html'">
            ← Back to Home
        </button>

    </div>

    <script src="script.js"></script>

</body>

      </html>
